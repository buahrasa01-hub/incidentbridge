modules:
  jira:issuePanel:
    - key: hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Hello World!
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
